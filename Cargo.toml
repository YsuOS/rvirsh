[package]
name = "rvirsh"
version = "0.1.3"
authors = ["Ryosuke Yasuoka <ryasuoka@redhat.com>"]
description = """
rvirsh is a Rust-based virtual machine management tool
built using the libvirt-rs library. It reimplements the
functionality of the virsh command, providing simple
and efficient virtualization operations in Rust.
"""
repository = "https://github.com/YsuOS/rvirsh"
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "rvirsh"
path = "src/lib.rs"

[[bin]]
name = "rv"
path = "src/bin/main.rs"

[dependencies]
virt = "0.4.1"
virt-sys = "0.3.0"
config = "0.14.0"
home = "0.5.9"
anyhow = "1.0.89"
quick-xml = "0.24.1"
regex = "1.11.0"
libc = "0.2.161"
termios = "0.3.3"

[build-dependencies]
home = "0.5.9"

[dev-dependencies]
assert_cmd = "2.0.16"
predicates = "=3.1.2"
