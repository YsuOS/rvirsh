name:
  $value: NAME
memory:
  $value: '1572864'
currentMemory:
  $value: '1572864'
vcpu:
  $value: '2'
os:
  type:
    '@arch': x86_64
    '@machine': q35
    $value: hvm
  boot:
    '@dev': hd
features:
  acpi: {}
  apic: {}
  vmport:
    '@state': 'off'
cpu:
  '@mode': host-passthrough
clock:
  '@offset': utc
  timer:
  - '@name': rtc
    '@tickpolicy': catchup
    '@present': null
  - '@name': pit
    '@tickpolicy': delay
    '@present': null
  - '@name': hpet
    '@tickpolicy': null
    '@present': 'no'
pm:
  suspend-to-mem:
    '@enabled': 'no'
  suspend-to-disk:
    '@enabled': 'no'
devices:
  emulator: /usr/bin/qemu-system-x86_64
  disk:
    '@type': file
    '@device': disk
    driver:
      '@name': qemu
      '@type': qcow2
    source:
      '@file': FILENAME
    target:
      '@dev': vda
      '@bus': virtio
  controller:
  - '@type': usb
    '@model': qemu-xhci
    '@port': '15'
  - '@type': pci
    '@model': pcie-root
    '@port': null
  - '@type': pci
    '@model': pcie-root-port
    '@port': null
  - '@type': pci
    '@model': pcie-root-port
    '@port': null
  - '@type': pci
    '@model': pcie-root-port
    '@port': null
  - '@type': pci
    '@model': pcie-root-port
    '@port': null
  - '@type': pci
    '@model': pcie-root-port
    '@port': null
  - '@type': pci
    '@model': pcie-root-port
    '@port': null
  - '@type': pci
    '@model': pcie-root-port
    '@port': null
  - '@type': pci
    '@model': pcie-root-port
    '@port': null
  - '@type': pci
    '@model': pcie-root-port
    '@port': null
  - '@type': pci
    '@model': pcie-root-port
    '@port': null
  - '@type': pci
    '@model': pcie-root-port
    '@port': null
  - '@type': pci
    '@model': pcie-root-port
    '@port': null
  - '@type': pci
    '@model': pcie-root-port
    '@port': null
  - '@type': pci
    '@model': pcie-root-port
    '@port': null
  interface:
    '@type': network
    source:
      '@network': default
    model:
      '@type': virtio
  console:
    '@type': pty
  channel:
  - '@type': unix
    source:
      '@mode': bind
    target:
      '@type': virtio
      '@name': org.qemu.guest_agent.0
  - '@type': spicevmc
    source: null
    target:
      '@type': virtio
      '@name': com.redhat.spice.0
  input:
    '@type': tablet
    '@bus': usb
  graphics:
    '@type': spice
    '@port': '-1'
    '@tlsPort': '-1'
    '@autoport': 'yes'
    image:
      '@compression': 'off'
  sound:
    '@model': ich9
  video:
    model:
      '@type': virtio
  redirdev:
  - '@bus': usb
    '@type': spicevmc
  - '@bus': usb
    '@type': spicevmc
  memballoon:
    '@model': virtio
  rng:
    '@model': virtio
    backend:
      '@model': random
      $value: /dev/urandom

